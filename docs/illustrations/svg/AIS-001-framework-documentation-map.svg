  <line x1="550" y1="290" x2="550" y2="172" stroke="#4a5568" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow-ref)"/>
  <line x1="400" y1="335" x2="264" y2="335" stroke="#4a5568" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow-ref)"/>
  <line x1="700" y1="335" x2="836" y2="335" stroke="#4a5568" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow-ref)"/>
  <line x1="430" y1="380" x2="340" y2="496" stroke="#4a5568" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow-ref)"/>
  <line x1="670" y1="380" x2="760" y2="496" stroke="#4a5568" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow-ref)"/>

  <!-- hands off -->
  <line x1="484" y1="539" x2="616" y2="539" stroke="#2d3748" stroke-width="2.25" marker-end="url(#arrow-handoff)"/>
  <text x="550" y="528" text-anchor="middle" class="sub" font-size="11" font-weight="600">hands off</text>

  <!-- AI callout (not a node) -->
  <rect x="300" y="610" width="500" height="36" rx="6" fill="#ffffff" stroke="#a0aec0" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="550" y="633" text-anchor="middle" class="caption" font-size="13">AI assistants use the same discovery path.</text>

  <!-- Legend -->
  <rect x="40" y="640" width="230" height="60" rx="4" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
  <text x="52" y="660" class="label" font-size="11" font-weight="600">Legend</text>
  <line x1="52" y1="676" x2="90" y2="676" stroke="#4a5568" stroke-width="1.75" stroke-dasharray="5 4"/>
  <text x="98" y="680" class="sub" font-size="11">references</text>
  <line x1="52" y1="692" x2="90" y2="692" stroke="#2d3748" stroke-width="2.25"/>
  <text x="98" y="696" class="sub" font-size="11">hands off</text>

  <text x="1060" y="700" text-anchor="end" class="badge" font-size="10">v1.0</text>

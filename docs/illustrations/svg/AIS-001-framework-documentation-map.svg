<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">AIS-001 - Framework Documentation Map</title>
  <desc id="desc">Documentation navigation map. README is the entry point and references the Whitepaper, Alpha Adoption Guide, Invocation Guide, Framework Assets, and ADRs. Adoption hands off to Invocation. Informative only; not a Runtime workflow.</desc>

  <!--
    AIS ID: AIS-001
    title: Framework Documentation Map
    Framework version: Framework v0.2.1
    illustration version: 1.0
    publication date: 2026-07-26
    status: Published
    force: Informative / Reference
    source: native SVG
    Hero: Yes
    Changes:
      v1.0 Initial publication
  -->

  <defs>
    <marker id="arrow-ref" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a5568"/>
    </marker>
    <marker id="arrow-handoff" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2d3748"/>
    </marker>
    <style type="text/css"><![CDATA[
      .label { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #1a202c; }
      .sub { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #4a5568; }
      .caption { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #2d3748; }
      .badge { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #4a5568; }
    ]]></style>
  </defs>

  <rect width="1100" height="720" fill="#f7fafc"/>

  <text x="40" y="36" class="label" font-size="20" font-weight="600">AIS-001 - Framework Documentation Map</text>
  <text x="40" y="58" class="badge" font-size="12">as of Framework v0.2.1 | Informative / Reference | not a Runtime workflow</text>

  <!-- Whitepaper (Informative dashed) -->
  <rect x="380" y="90" width="340" height="78" rx="8" fill="#edf2f7" stroke="#718096" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="550" y="122" text-anchor="middle" class="label" font-size="15" font-weight="600">Whitepaper</text>
  <text x="550" y="144" text-anchor="middle" class="sub" font-size="12">Understand the architecture</text>
  <text x="550" y="162" text-anchor="middle" class="sub" font-size="11">(Optional but recommended)</text>

  <!-- ADRs (Framework) -->
  <rect x="40" y="300" width="220" height="70" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="150" y="330" text-anchor="middle" class="label" font-size="15" font-weight="600">ADRs</text>
  <text x="150" y="352" text-anchor="middle" class="sub" font-size="12">Architectural authority</text>

  <!-- Framework Assets (Framework) -->
  <rect x="840" y="300" width="220" height="70" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="950" y="330" text-anchor="middle" class="label" font-size="15" font-weight="600">Framework Assets</text>
  <text x="950" y="352" text-anchor="middle" class="sub" font-size="12">Working guidance</text>


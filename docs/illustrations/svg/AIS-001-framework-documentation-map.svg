  <rect x="200" y="500" width="280" height="78" rx="8" fill="#edf2f7" stroke="#718096" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="340" y="530" text-anchor="middle" class="label" font-size="14" font-weight="600">Framework v0.2.1</text>
  <text x="340" y="548" text-anchor="middle" class="label" font-size="14" font-weight="600">Adoption Guide</text>
  <text x="340" y="568" text-anchor="middle" class="sub" font-size="12">Evaluate - establish Project Integration</text>

